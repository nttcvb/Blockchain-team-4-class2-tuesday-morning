[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-ust-sim"
version = "0.1.0"
description = "Historical Terra run laboratory: cadCAD, ABM and stock-flow accounting"
requires-python = ">=3.11"
dependencies = ["cadCAD==0.5.3", "numpy>=1.26", "pandas>=2.2", "pyarrow>=16", "scipy>=1.12", "plotly>=6", "streamlit>=1.40", "requests>=2.31", "pypdf>=5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["luna_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
